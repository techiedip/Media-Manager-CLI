[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediamanager"
version = "0.1.0"
description = "Lightweight CLI clone of tinyMediaManager: scrape, NFO, artwork, subtitles, rename."
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "lxml>=5",
  "guessit>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mm = "mediamanager.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
